services:
  rust-guestbook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust_web_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=sqlite:///app/data/guestbook.db
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
    volumes:
      # 將容器內的 /app/data 掛載到本機的 ./docker_data 資料夾，永久保存 SQLite 資料庫
      - ./docker_data:/app/data
